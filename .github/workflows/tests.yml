name: Windows tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rendering:
        description: Run renderer fixtures explicitly
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:qa
      - run: npm run check:docs
      - name: Select renderer checks
        id: renderer
        shell: pwsh
        run: |
          $base = '${{ github.event.pull_request.base.sha || github.event.before }}'
          if (-not $base -or $base -match '^0+$') { $base = git merge-base HEAD origin/main }
          if ($LASTEXITCODE) { throw 'Could not determine comparison base' }
          $changed = @(git diff --name-only $base HEAD -- payload.js lib/archive.cjs tests/fixture.cjs tests/render.cjs tests/surfaces.cjs tests/native-editor.cjs package-lock.json)
          if ($LASTEXITCODE) { throw 'Could not inspect changed files' }
          $requested = '${{ inputs.rendering }}' -eq 'true'
          $shouldRun = [bool]($requested -or $changed.Count)
          "run=$($shouldRun.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - if: steps.renderer.outputs.run == 'true'
        run: npx --no-install playwright install chromium
      - if: steps.renderer.outputs.run == 'true'
        run: npm run test:render
      - if: steps.renderer.outputs.run == 'true'
        run: npm run test:surfaces
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -Recurse -Filter *.ps1 | Where-Object FullName -NotMatch node_modules | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            $failures += $errors
          }
          if ($failures.Count) { $failures | Format-List; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
