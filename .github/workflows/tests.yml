name: Windows tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install chromium
      - run: npm test
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -Recurse -Filter *.ps1 | Where-Object FullName -NotMatch node_modules | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            $failures += $errors
          }
          if ($failures.Count) { $failures | Format-List; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
